<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cacchea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;600;800;900&display=swap">
<style>
/* Tavolo da gioco in panno verde con bordo di legno: classifica in alto, vassoio dei dadi al centro, azioni sotto */
:root{
  --felt:#163a2a; --felt-2:#1d4a36; --felt-3:#24583f; --wood:#6e4325; --wood-2:#8c5a33;
  --ink:#f4ecd8; --muted:#a8c2b2; --gold:#e8b94a; --gold-ink:#2a1d05; --danger:#ec7d64;
  --ivory:#f8f2e2; --ivory-edge:#cdbf9f; --brown:#7b4a24;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--felt-3),var(--felt) 70%) fixed,var(--felt);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

header{display:flex;align-items:center;gap:8px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:30px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px;line-height:1}
.brand svg{width:34px;height:34px}
.hbtn{border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:color-mix(in srgb,var(--felt) 60%,transparent);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.hbtn:hover{background:var(--felt-3)}
.tabs{display:flex;gap:4px;background:var(--felt);border-radius:999px;padding:4px;width:100%;order:5}
.tabs button{flex:1;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:900;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ivory);color:#2b2418}
@media (min-width:640px){.tabs{width:auto;order:0}.tabs button{flex:none}}

.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:16px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--felt-3);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ivory{background:var(--ivory);color:#2b2418}
.btn.ghost{background:transparent;border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);box-shadow:none}
.btn.danger{background:var(--danger);color:#2a0d06}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{font-weight:700;opacity:.8;font-size:13px}

h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:22px}
h3{font-size:17px}
.sub{color:var(--muted);margin:4px 0 0}

.panel{background:color-mix(in srgb,var(--felt-2) 85%,transparent);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);border-radius:20px;padding:20px;margin-top:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:8px}
.hero .dice-strip{display:flex;gap:6px;flex-wrap:wrap}
.hero .dice-strip svg{width:44px;height:44px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{position:relative;display:flex;align-items:center;gap:8px;border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);background:var(--felt);border-radius:999px;padding:5px 16px 5px 5px;font-weight:800;min-height:46px}
.chip.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--felt))}
.chip .ord{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--gold-ink);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.chip .x{margin-left:2px;margin-right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0;display:grid;place-items:center}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ivory);font-size:19px;line-height:1;flex:none}
.addrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.addrow input{flex:1;min-width:0;border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--felt);border-radius:12px;padding:10px 14px;font-size:16px;color:var(--ink)}
.startrow{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.startrow .hint{color:var(--muted);font-size:14px}

/* storia */
.setrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:14px}
.setrow .k{font-weight:800;min-width:170px}
.seg{display:inline-flex;background:var(--felt);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;min-width:44px;padding:8px 10px;border-radius:9px;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.purse{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.coins{font-family:var(--font-display);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.pw{background:var(--felt);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pw .top{display:flex;gap:10px;align-items:center}
.pw .ic{font-size:28px;line-height:1}
.pw b{display:block}
.pw span{font-size:13px;color:var(--muted)}
.pw .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.pw .have{font-weight:900;font-size:14px}
.path{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.node{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--felt);border:2px solid transparent}
.node.now{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--felt))}
.node.lock{opacity:.5}
.node.mini{margin-left:26px;padding-block:7px}
.node .ic{font-size:26px;width:36px;text-align:center;flex:none;line-height:1}
.node .tx{flex:1;min-width:0}
.node b{display:block}
.node span{font-size:13px;color:var(--muted);display:block}
.node .st{font-weight:900;color:var(--gold);flex:none}
.stars{color:var(--gold);letter-spacing:1px}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 22%,var(--felt));border:2px solid var(--gold);border-radius:16px;padding:14px 16px;margin-top:14px}
.banner .tx{flex:1;min-width:200px}

/* classifica */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:4px}
.pl{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--felt) 75%,transparent);border:2px solid transparent;border-radius:14px;padding:8px 10px;min-width:0}
.pl.now{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--felt))}
.pl.out{opacity:.6}
.pl .info{min-width:0;flex:1}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:14px}
.pl .sc{font-family:var(--font-display);font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.pl .tags{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--muted);flex-wrap:wrap}
.tag{border-radius:999px;padding:0 7px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.tag.warn{background:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--ink)}
.tag.ok{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--ink)}
.pc{display:inline-flex;align-items:center;gap:2px}
.pc svg{width:15px;height:15px}

/* tavolo */
.table{margin-top:14px;border-radius:26px;padding:10px;background:linear-gradient(160deg,var(--wood-2),var(--wood));box-shadow:0 10px 30px rgba(0,0,0,.4)}
.felt{border-radius:18px;background:radial-gradient(ellipse at 50% 30%,var(--felt-3),var(--felt) 80%);padding:18px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:inset 0 2px 12px rgba(0,0,0,.45)}
.lvbar{font-weight:900;font-size:13px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.08em}
.who{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;text-align:center;flex-wrap:wrap;justify-content:center}
.who .av{width:40px;height:40px;font-size:23px}
.finalbar{background:var(--danger);color:#2a0d06;font-weight:900;border-radius:999px;padding:4px 14px;font-size:14px;text-align:center}
.minibar{background:var(--gold);color:var(--gold-ink);font-weight:900;border-radius:999px;padding:4px 14px;font-size:14px;text-align:center}
.pts{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap;text-align:center}
.pts .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.pts .v{font-family:var(--font-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.pts .v.sel{color:var(--gold);font-size:28px}
.held{display:flex;gap:6px;align-items:center;min-height:42px;flex-wrap:wrap;justify-content:center}
.held .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.held svg{width:36px;height:36px;opacity:.8}
.dice{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap;min-height:76px;align-items:center}
.dbtn{border:0;background:none;padding:0;border-radius:16px;position:relative;transition:transform .15s}
.dbtn svg{width:min(66px,16vw);height:min(66px,16vw);display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
.dbtn:disabled{cursor:default}
.dbtn.sel{transform:translateY(-10px)}
.dbtn.sel svg .dbody{stroke:var(--gold);stroke-width:7}
.dbtn.sel::after{content:"blocca";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:11px;font-weight:900;color:var(--gold)}
.dbtn.fixing svg .dbody{stroke:#8fd3ff;stroke-width:6;stroke-dasharray:10 6}
.dbtn.tumble svg{animation:tumble .6s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--d)}
@keyframes tumble{0%{transform:translateY(-40px) rotate(var(--r)) scale(.6);opacity:0}55%{transform:translateY(6px) rotate(calc(var(--r) * -.08)) scale(1.04);opacity:1}100%{transform:none}}
.emptydice{color:var(--muted);font-weight:700;text-align:center}
.dbody{fill:var(--ivory);stroke:var(--ivory-edge);stroke-width:2.5}
.msg{min-height:22px;font-size:14px;font-weight:800;text-align:center;color:var(--muted)}
.msg.bad{color:var(--danger)}
.msg.good{color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.actions .wide{grid-column:1/-1}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
.smallrow,.powrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.link{border:0;background:none;color:var(--muted);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}

/* tiro a segno */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px;width:100%}
.goal{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--felt) 80%,transparent);font-weight:700;font-size:14px}
.goal b{color:var(--gold);white-space:nowrap}
.goal.got{background:color-mix(in srgb,var(--gold) 30%,var(--felt));text-decoration:line-through;text-decoration-color:var(--gold)}
.goal.new{animation:pop .5s both}

/* diario */
.log{margin-top:16px}
.log h3{font-family:var(--font-body);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.log ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.log li{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--felt) 70%,transparent)}
.log li b{font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.log li.bad b{color:var(--danger)}
.log li.good b{color:var(--gold)}
.log li svg{width:18px;height:18px;flex:none}

/* sovrapposizioni */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,18,12,.72);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.box{background:var(--felt-2);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:20px;padding:20px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:calc(100vh - 32px);overflow:auto}
.box h2{margin-bottom:8px}
.box .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.reward{text-align:center}
.reward .big{font-family:var(--font-display);font-size:60px;color:var(--gold);line-height:1.1;animation:pop .5s .2s both}
.rules table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 12px}
.rules td{padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);vertical-align:middle}
.rules td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.rules td svg{width:30px;height:30px;vertical-align:middle;margin-right:2px}
.rules p,.rules li{font-size:15px;margin:6px 0}
.rules ul{padding-left:20px}
.rules h3{margin-top:14px}

.poopov{background:rgba(30,16,6,.6);cursor:pointer}
.poopwrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.poopwrap .poop{width:var(--sz);max-width:86vw;max-height:52vh;animation:plop .9s cubic-bezier(.3,1.4,.5,1) both}
.poopwrap h1{font-size:clamp(34px,9vw,var(--fs));color:var(--ink);text-shadow:0 4px 0 var(--brown);animation:pop .5s .45s both}
.poopwrap p{margin:0;font-weight:800;font-size:18px;animation:pop .5s .6s both}
.poopwrap .tap{color:var(--muted);font-size:14px;font-weight:700;margin-top:6px}
.saves{display:grid;gap:8px;margin-top:10px;width:min(420px,100%);cursor:default}
@keyframes plop{0%{transform:translateY(-70vh) scale(.5);opacity:0}55%{transform:translateY(0) scale(1.18,.78);opacity:1}75%{transform:scale(.94,1.08)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.fly{animation:buzz 1.6s linear infinite;transform-origin:60px 60px}
.fly.f2{animation-duration:2.2s;animation-direction:reverse}
@keyframes buzz{to{transform:rotate(360deg)}}
.stink{animation:stink 1.8s ease-in-out infinite}
@keyframes stink{0%,100%{opacity:.25;transform:translateY(4px)}50%{opacity:.9;transform:translateY(-4px)}}
body.shake .wrap{animation:shake .7s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ivory);color:#2b2418;font-weight:900;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.25s;z-index:30;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* fine partita */
.final{display:grid;gap:8px;margin-top:12px}
.final .f{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--felt)}
.final .f.win{background:color-mix(in srgb,var(--gold) 28%,var(--felt));border:2px solid var(--gold)}
.final .pos{font-family:var(--font-display);font-size:22px;width:30px;text-align:center}
.final .n{flex:1;font-weight:900;min-width:0}
.final .s{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.award{background:var(--felt);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.award svg{width:44px;height:44px;flex:none}
.award .k{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.award b{display:block}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="brand"></div>
    <div class="tabs" id="tabs">
      <button data-act="tab" data-t="free">Partita</button>
      <button data-act="tab" data-t="story">Storia</button>
    </div>
    <button class="hbtn" data-act="rules">Regole</button>
    <button class="hbtn" data-act="sound" id="sndBtn">Suono: sì</button>
    <button class="hbtn" data-act="quit" id="quitBtn" hidden>Esci</button>
  </header>
  <main id="main"></main>
</div>

<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast"></div>

<script>
// ---------- LOGICA (inizio) ----------
// facce: 0=9, 1=10, 2=J, 3=Q, 4=K, 5=Asso
const NAMES = ['9','10','J','Q','K','Asso'];
const TRIS  = [200,300,400,500,600,700];
const SINGLE = {5:100, 3:50};
const OPEN = 600, OUT = 5000;

function rnd6(){ const a = new Uint8Array(1); do{ crypto.getRandomValues(a); }while(a[0] >= 252); return a[0] % 6; }
const counts = faces => { const c = [0,0,0,0,0,0]; faces.forEach(f => c[f]++); return c; };

// punti di un gruppo di dadi bloccati insieme: ogni dado deve contare
function evalSel(faces){
  if(!faces.length) return {ok:false, pts:0, why:''};
  const c = counts(faces); let pts = 0;
  for(let f=0; f<6; f++){
    let n = c[f];
    if(n >= 3){ pts += TRIS[f]; n -= 3; }
    if(n > 0){
      if(SINGLE[f]) pts += SINGLE[f]*n;
      else return {ok:false, pts:0, why:`${NAMES[f]}: ${c[f]===1?'da solo non vale':'in '+c[f]+' non vale'}, serve un tris`};
    }
  }
  return {ok:true, pts};
}
// c'è almeno un dado bloccabile? altrimenti è cacchea
const scores = faces => faces.some(f => f===5 || f===3) || counts(faces).some(n => n >= 3);
// selezione che fa più punti
function bestSel(roll){
  const c = counts(roll), take = [0,0,0,0,0,0];
  for(let f=0; f<6; f++){ if(c[f] >= 3) take[f] = SINGLE[f] ? c[f] : 3; else if(SINGLE[f]) take[f] = c[f]; }
  const idx = [];
  roll.forEach((f,i) => { if(take[f] > 0){ take[f]--; idx.push(i); } });
  return idx;
}
// tutte le selezioni valide di un lancio
function options(roll){
  const out = [], n = roll.length;
  for(let m=1; m < (1<<n); m++){
    const idx = []; for(let i=0; i<n; i++) if(m >> i & 1) idx.push(i);
    const ev = evalSel(idx.map(i => roll[i]));
    if(ev.ok) out.push({idx, pts:ev.pts, left:n - idx.length});
  }
  return out;
}

// ---- avversari automatici ----
// valore indicativo dei dadi che restano da tirare (0 = tutti bloccati, si riparte con 5)
const KEEP_VALUE = [350, 40, 80, 150, 250, 350];
// sotto questi punti di turno un giocatore bravo continua a tirare, in base ai dadi che tirerebbe
const STOP_AT = {1:300, 2:350, 3:550, 4:1100, 5:Infinity};
const leadOthers = (G,p) => Math.max(0, ...G.players.filter(q => q !== p).map(q => q.score));
const naiveStop = (ai, rand=Math.random) => Math.round((250 + rand()*650) * ai.greed / 50) * 50;

function aiChoose(G, rand=Math.random){
  const p = G.players[G.cur], T = G.turn, ai = p.ai;
  const opts = options(T.roll);
  const max = opts.reduce((a,o) => o.pts > a.pts ? o : a);
  const smart = rand() < ai.skill;
  const cont = smart ? opts.reduce((a,o) => o.pts + KEEP_VALUE[o.left] > a.pts + KEEP_VALUE[a.left] ? o : a) : max;
  const total = T.pts + max.pts, goal = G.target || OUT;
  let stop = false;
  if(p.opened || total >= OPEN){
    if(G.final) stop = p.score + total > leadOthers(G,p);
    else if(smart) stop = total >= STOP_AT[cont.left || 5] * ai.greed || (p.score <= goal && p.score + total > goal && total >= 300);
    else stop = total >= T.naive;
  }
  return stop ? {idx:max.idx, stop:true} : {idx:cont.idx, stop:false};
}

function audio(){

    if(AC.state === 'suspended') AC.resume();

function sndRoll(n){
  const c = audio(); if(!c) return; const t0 = c.currentTime;
  for(let i=0; i<n*2+3; i++){
    const len = .035, buf = c.createBuffer(1, Math.floor(c.sampleRate*len), c.sampleRate), d = buf.getChannelData(0);
    for(let j=0; j<d.length; j++) d[j] = (Math.random()*2-1) * Math.pow(1 - j/d.length, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1500 + Math.random()*2500; f.Q.value = 2.5; g.gain.value = .5;
    s.connect(f).connect(g).connect(c.destination); s.start(t0 + Math.random()*.38);
  }
}
function sndTone(freqs, dur=.11){
  const c = audio(); if(!c) return;
  freqs.forEach((fq,i) => {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i*dur;
    o.type = 'triangle'; o.frequency.value = fq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur*1.8);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur*2);
  });
}
// pernacchia: più grossa la cacchea, più lunga e grave
function sndFart(lv){
  const c = audio(); if(!c) return;
  const t = c.currentTime + .25, dur = .35 + lv*.32;
  const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(115 - lv*10, t); o.frequency.linearRampToValueAtTime(60 - lv*5, t+dur);
  lfo.type = 'square'; lfo.frequency.value = 22 + Math.random()*8; lg.gain.value = 28;
  lfo.connect(lg).connect(o.frequency);
  f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 6;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t+.04);
  g.gain.setValueAtTime(.3, t+dur*.7); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(f).connect(g).connect(c.destination);
  o.start(t); lfo.start(t); o.stop(t+dur+.05); lfo.stop(t+dur+.05);
}

function playNode(){
  const st = story(S.hero), node = PATH[st.step]; if(!node) return;
  audio();
  if(node.lv != null) startLevel(S.hero, st.step);
  else if(node.mini === 'tiro'){ S.tiro = {pid:S.hero, step:st.step, left:6, got:[], coins:0, dice:null, last:''}; tiroNew = []; save(); render(); }
  else startMano(S.hero, st.step);
}
const heroPlayer = pid => { const p = S.roster.find(r => r.id === pid); return {id:pid, name:p.name, emoji:p.emoji, score:0, opened:false, cacchee:0, maxLoss:0}; };
function startLevel(pid, step){
  const st = story(pid), lv = PATH[step].lv, L = LEVELS[lv];
  const opp = L.opp.slice(0, st.nOpp).map((o,i) => ({id:`ai-${lv}-${i}`, name:o[0], emoji:o[1], ai:L.ai, score:0, opened:false, cacchee:0, maxLoss:0}));
  makeGame([heroPlayer(pid), ...opp], {story:{pid, step, lv, n:st.nOpp}});
}
function startMano(pid, step){
  const p = heroPlayer(pid); p.opened = true;
  makeGame([p], {mini:{pid, step, left:3}});
}

// ---------- Partita ----------
function startGame(){
  makeGame(S.pick.map(id => { const p = S.roster.find(r => r.id === id); return {id, name:p.name, emoji:p.emoji, score:0, opened:false, cacchee:0, maxLoss:0}; }), {});
}
function makeGame(players, extra){
  S.G = Object.assign({players, cur:0, final:null, over:false, log:[], turn:null, bigPoop:null, target:S.target || OUT}, extra);
  startTurn();
}
function startTurn(){
  const G = S.G, p = cp();
  G.turn = {pts:0, held:[], roll:null, sel:[]};
  G.fixMode = false;
  if(p.ai) G.turn.naive = naiveStop(p.ai);
  save(); render();
  toast((G.final ? 'Ultimo tiro: ' : 'Tocca a ') + p.name);
  aiGo();
}
const cp = () => S.G.players[S.G.cur];
const heroStory = () => S.G && S.G.story && !cp().ai ? story(S.G.story.pid) : null;
function log(text, val, kind){ const p = cp(); S.G.log.unshift({e:p.emoji, n:p.name, text, val, kind}); S.G.log.length = Math.min(S.G.log.length, 40); }

function viewGame(){
  const G = S.G, p = cp(), T = G.turn, isAI = !!p.ai, st = heroStory();
  const selFaces = T.roll ? T.sel.map(i => T.roll[i]) : [];
  const ev = evalSel(selFaces);
  const left = T.roll ? T.roll.length - T.sel.length : 5;
  const free = !busy && !isAI;
  const canRoll = free && (!T.roll || ev.ok);
  const bankPts = T.pts + (ev.ok ? ev.pts : 0);
  const canBank = free && T.roll && ev.ok && (p.opened || bankPts >= OPEN);
  const goal = G.target || OUT;
  const canOut = free && !T.roll && !G.final && !G.mini && p.score > goal;

  let msg = '', mcls = '';
  if(busy) msg = 'I dadi rotolano…';
  else if(isAI) msg = T.sel.length ? `${p.name} blocca +${ev.pts}` : `${p.name} ci pensa…`;
  else if(G.fixMode){ msg = 'Tocca il dado da trasformare in Asso'; mcls = 'good'; }
  else if(!T.roll) msg = !p.opened ? `Per aprire servono almeno ${OPEN} punti in un turno` : canOut ? `Hai superato ${fmt(goal)}: puoi chiamarti fuori prima di tirare` : 'Tira i dadi!';
  else if(!T.sel.length) msg = 'Tocca i dadi che vuoi bloccare';
  else if(!ev.ok){ msg = ev.why; mcls = 'bad'; }
  else if(!p.opened && bankPts < OPEN) msg = `Per aprire ti mancano ${fmt(OPEN - bankPts)} punti: devi rischiare ancora`;
  else { msg = left === 0 ? 'Tutti bloccati! Puoi ripartire con 5 dadi' : `Bloccati +${ev.pts}`; mcls = 'good'; }

  const rollLabel = !T.roll ? 'Lancia 5 dadi' : left === 0 ? 'Blocca e rilancia 5' : `Blocca e rilancia ${left}`;
  const top = G.story ? `<div class="lvbar">${LEVELS[G.story.lv].emoji} Livello ${G.story.lv+1} · ${esc(LEVELS[G.story.lv].name)}</div>` : '';
  const mini = G.mini ? `<div class="minibar">Minibonus · Turno ${4 - G.mini.left} di 3 · ${fmt(p.score)} punti = ${Math.min(8, Math.floor(p.score/250))} 💰</div>` : '';
  const powers = st ? `<div class="powrow">
      <button class="btn ivory sm" data-act="fix" ${free && T.roll && st.pw.fix ? '' : 'disabled'}>✋ Ritocco · ${st.pw.fix}</button>
      ${!p.opened ? `<button class="btn ivory sm" data-act="clover" ${free && st.pw.clover ? '' : 'disabled'}>🍀 Apri subito · ${st.pw.clover}</button>` : ''}
      <span class="btn ghost sm" title="Si usa quando fai cacchea">🧻 ${st.pw.roll}</span></div>` : '';

  $main.innerHTML = `
  <div class="board">${G.players.map((q,i) => `
    <div class="pl ${i===G.cur?'now':''} ${G.final && G.final.by===i?'out':''}">
      ${av(q)}
      <div class="info"><span class="nm">${esc(q.name)}</span>
        <span class="sc">${fmt(q.score)}</span>
        <span class="tags">${q.opened ? '' : '<span class="tag warn">da aprire</span>'}${G.final && G.final.by===i ? '<span class="tag ok">fuori</span>' : !G.mini && q.score > goal ? `<span class="tag ok">oltre ${fmt(goal)}</span>` : ''}${q.cacchee ? `<span class="pc">${poopSVG(0)}${q.cacchee}</span>` : ''}</span>
      </div>
    </div>`).join('')}
  </div>
  <div class="table"><div class="felt">
    ${top}${mini}
    ${G.final ? `<div class="finalbar">Ultimo giro! ${esc(G.players[G.final.by].name)} si è chiamato fuori</div>` : ''}
    <div class="who">${av(p)}Tocca a ${esc(p.name)}</div>
    <div class="pts">
      <div><div class="k">Punti del turno</div><div class="v">${fmt(T.pts)}</div></div>
      ${ev.ok ? `<div><div class="k">Selezione</div><div class="v sel">+${ev.pts}</div></div>` : ''}
    </div>
    <div class="held">${T.held.length ? '<span class="lbl">Bloccati</span>' + T.held.map(dieSVG).join('') : ''}</div>
    <div class="dice">${T.roll ? T.roll.map((f,i) => {
        const on = T.sel.includes(i);
        return `<button class="dbtn ${on?'sel':''} ${tumble?'tumble':''} ${G.fixMode?'fixing':''}" style="--r:${(Math.random()*500-250)|0}deg;--d:${i*45}ms" data-act="die" data-i="${i}" aria-pressed="${on}" ${free?'':'disabled'}>${dieSVG(f)}</button>`;
      }).join('') : `<div class="emptydice">${T.held.length ? '' : '5 dadi pronti'}</div>`}</div>
    <div class="msg ${mcls}" aria-live="polite">${esc(msg)}</div>
    <div class="actions">
      <button class="btn gold ${T.roll?'':'wide'}" data-act="roll" ${canRoll?'':'disabled'}>${rollLabel}</button>
      ${T.roll ? `<button class="btn ivory" data-act="bank" ${canBank?'':'disabled'}>Fermati e segna <small>+${fmt(bankPts)}</small></button>` : ''}
      ${canOut ? `<button class="btn danger wide" data-act="callout">Mi chiamo fuori</button>` : ''}
    </div>
    ${T.roll && free ? `<div class="smallrow"><button class="link" data-act="best">Blocca tutti quelli che valgono</button>${T.sel.length?'<button class="link" data-act="clearsel">Sblocca</button>':''}</div>` : ''}
    ${powers}
  </div></div>
  ${G.log.length ? `<section class="log"><h3>Diario della partita</h3><ul>${G.log.slice(0,8).map(l => `<li class="${l.kind}">${l.kind==='bad'?poopSVG(0):''}<span>${esc(l.e)} <strong>${esc(l.n)}</strong> ${esc(l.text)}</span><b>${esc(l.val)}</b></li>`).join('')}</ul></section>` : ''}`;
  tumble = false;
}

// commit = false: rilancia gli stessi dadi senza bloccare (rotolo salvacacca)
function roll(commit=true){
  const G = S.G, T = G.turn, p = cp(); if(busy) return;
  if(commit && T.roll){
    const faces = T.sel.map(i => T.roll[i]), ev = evalSel(faces); if(!ev.ok) return;
    T.pts += ev.pts; T.held.push(...faces);
    if(T.held.length >= 5){ T.held = []; toast('Tutti i dadi bloccati! Si riparte con 5'); sndTone([660,880,1100]); }
  }
  const n = 5 - T.held.length;
  T.roll = Array.from({length:n}, rnd6);
  if(p.ai && aiReroll(p.ai, T.roll)) T.roll = Array.from({length:n}, rnd6);
  T.sel = []; G.fixMode = false;
  busy = true; tumble = true; save(); render(); sndRoll(n); vib(30);
  setTimeout(() => {
    if(S.G !== G) return;
    busy = false;
    if(!scores(T.roll)) cacchea(); else { render(); aiGo(); }
  }, p.ai && S.aiFast ? 450 : 800);
}

function bank(){
  const G = S.G, p = cp(), T = G.turn;
  const ev = evalSel(T.sel.map(i => T.roll[i])); if(!ev.ok) return;
  const pts = T.pts + ev.pts;
  if(!p.opened && pts < OPEN) return;
  const wasOpen = p.opened;
  p.score += pts; p.opened = true;
  log(wasOpen ? 'segna' : 'apre e segna', '+' + fmt(pts), 'good');
  sndTone([523,659,784]); vib([20,40,20]);
  toast(`${p.name} segna ${fmt(pts)} punti`);
  nextTurn();
}

function cacchea(){
  const G = S.G, p = cp(), lost = G.turn.pts, lv = poopLevel(lost), P = POOP[lv], st = heroStory();
  const saves = st && (st.pw.roll || st.pw.fix) ? `<div class="saves">
      ${st.pw.roll ? `<button class="btn ivory" data-act="saveroll">🧻 Rotolo salvacacca: rilancia (${st.pw.roll})</button>` : ''}
      ${st.pw.fix ? `<button class="btn ivory" data-act="savefix">✋ Ritocco: un dado diventa Asso (${st.pw.fix})</button>` : ''}</div>` : '';
  render();
  openOv(`<div class="poopwrap" style="--sz:${P.sz}px;--fs:${P.fs}px">
      ${poopSVG(lv,'poop')}
      <h1>${P.t}</h1>
      <p>${esc(p.name)} ${lost ? `perde ${fmt(lost)} punti` : 'non perde niente, per fortuna'}</p>
      ${saves}
      <div class="tap">${p.ai ? '' : 'Tocca per passare il turno'}</div>
    </div>`, 'poopov');
  sndFart(lv); vib(lv >= 3 ? [80,40,200] : 120);
  if(lv >= 3){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); }
  busy = true;
  const token = ++poopToken;
  const done = () => {
    if(token !== poopToken || S.G !== G) return;
    poopToken++; busy = false; closeOv();
    p.cacchee++; p.maxLoss = Math.max(p.maxLoss, lost);
    if(!G.bigPoop || lost > G.bigPoop.lost) G.bigPoop = {name:p.name, emoji:p.emoji, lost};
    log('fa cacchea', lost ? '−' + fmt(lost) : '0', 'bad');
    nextTurn();
  };
  setTimeout(() => { if(token === poopToken) $ov.onclick = e => { if(!e.target.closest('[data-act]')) done(); }; }, 600);
  if(p.ai) setTimeout(done, S.aiFast ? 1300 : 2300);
}
function savePoop(kind){
  const st = heroStory(), T = S.G.turn;
  poopToken++; busy = false; closeOv();
  if(kind === 'roll'){ st.pw.roll--; log('usa il rotolo salvacacca', '🧻', 'good'); toast('Rotolo salvacacca! Rilanci'); roll(false); }
  else { st.pw.fix--; T.roll[0] = 5; T.sel = []; log('usa il ritocco', '✋', 'good'); save(); render(); toast('Ritocco: un dado è diventato Asso'); }
}

function nextTurn(){
  const G = S.G;
  if(G.mini){ G.mini.left--; if(G.mini.left <= 0) return finishMano(); return startTurn(); }
  G.cur = (G.cur + 1) % G.players.length;
  if(G.final && G.cur === G.final.by) return finishGame();
  startTurn();
}
function callOut(){
  const G = S.G; G.final = {by:G.cur};
  log('si chiama fuori', fmt(cp().score), 'good');
  sndTone([392,523,392,523], .14);
  nextTurn();
}
function finishGame(){
  const G = S.G; G.over = true;
  if(G.story){
    const hero = G.players[0], top = Math.max(...G.players.map(q => q.score));
    G.won = hero.score === top;
    if(G.won){
      const st = story(G.story.pid), r = levelReward(G.story.lv, G.story.n);
      st.coins += r; st.wins++; st.step = Math.max(st.step, G.story.step + 1);
      if(G.story.step === PATH.length - 1) st.done++;
      G.reward = r;
    }
  }
  save(); render();
  sndTone(G.story && !G.won ? [392,349,311,262] : [523,659,784,1047], .16);
}
function finishMano(){
  const G = S.G, p = G.players[0], coins = Math.min(8, Math.floor(p.score / 250)), st = story(G.mini.pid);
  st.coins += coins; st.step = Math.max(st.step, G.mini.step + 1);
  S.G = null; S.tab = 'story'; save(); render();
  showReward('Una mano sola', `Hai fatto ${fmt(p.score)} punti in 3 turni.`, coins);
}

// ---------- Avversari automatici: un passo alla volta ----------
function aiGo(){
  clearTimeout(aiTimer);
  const G = S.G; if(!G || G.over || busy || !cp().ai) return;
  aiTimer = setTimeout(aiAct, S.aiFast ? 350 : 900);
}
function aiAct(){
  const G = S.G; if(!G || G.over || busy || !cp().ai) return;
  const T = G.turn;
  if(!T.roll){ if(aiCallOut(G)) return callOut(); return roll(); }
  const d = aiChoose(G);
  T.sel = d.idx; render();
  aiTimer = setTimeout(() => { if(S.G === G && !busy) d.stop ? bank() : roll(); }, S.aiFast ? 400 : 1000);
}

// ---------- Fine partita ----------
function viewEnd(){
  const G = S.G, list = [...G.players].sort((a,b) => b.score - a.score), top = list[0].score;
  const winners = list.filter(q => q.score === top);
  const king = [...G.players].sort((a,b) => b.cacchee - a.cacchee)[0];
  let head = winners.length > 1 ? 'Pareggio tra ' + winners.map(w => esc(w.name)).join(' e ') : 'Vince ' + esc(winners[0].name) + '!';
  let sub = "Partita finita dopo l'ultimo giro.", btns;
  if(G.story){
    const last = G.story.step === PATH.length - 1;
    if(G.won){
      head = last ? 'Re Caccone è battuto!' : `Livello ${G.story.lv+1} superato!`;
      sub = `${esc(G.players[0].name)} vince e prende ${G.reward} monete.`;
      btns = `<button class="btn gold" data-act="tostory">${last ? 'Torna alla storia' : 'Continua la storia'}</button>`;
    } else {
      head = 'Livello perso';
      sub = `Ha vinto ${esc(winners[0].name)}. Puoi riprovare quante volte vuoi.`;
      btns = `<button class="btn gold" data-act="retry">Riprova</button><button class="btn ghost" data-act="tostory">Torna alla storia</button>`;
    }
  } else btns = `<button class="btn gold" data-act="again">Rivincita</button><button class="btn ghost" data-act="newsetup">Cambia giocatori</button>`;
  $main.innerHTML = `
  <div class="panel">
    <h2>${head}</h2>
    <p class="sub">${sub}</p>
    <div class="final">${list.map((q,i) => `<div class="f ${q.score===top?'win':''}"><span class="pos">${q.score===top?'🏆':i+1}</span>${av(q)}<span class="n">${esc(q.name)}</span><span class="s">${fmt(q.score)}</span></div>`).join('')}</div>
    <div class="awards">
      ${G.bigPoop && G.bigPoop.lost ? `<div class="award">${poopSVG(poopLevel(G.bigPoop.lost))}<div><span class="k">Caccone più grosso</span><b>${esc(G.bigPoop.emoji)} ${esc(G.bigPoop.name)}</b>persi ${fmt(G.bigPoop.lost)} punti in un colpo</div></div>` : ''}
      ${king.cacchee ? `<div class="award">${poopSVG(1)}<div><span class="k">Re della cacchea</span><b>${esc(king.emoji)} ${esc(king.name)}</b>${king.cacchee} cacchee in tutta la partita</div></div>` : ''}
    </div>
    <div class="startrow">${btns}</div>
  </div>`;
}

// ---------- Minibonus: tiro a segno ----------
function viewTiro(){
  const T = S.tiro;
  $main.innerHTML = `
  <div class="table"><div class="felt">
    <div class="minibar">Minibonus · Tiro a segno · ${T.coins} 💰</div>
    <div class="who">🎯 Ogni combinazione vale una volta sola</div>
    <div class="goals">${TIRO_GOALS.map((g,i) => `<div class="goal ${T.got.includes(i)?'got':''} ${tiroNew.includes(i)?'new':''}"><span>${g.t}</span><b>${g.c} 💰</b></div>`).join('')}</div>
    <div class="dice">${T.dice ? T.dice.map((f,i) => `<span class="dbtn ${tumble?'tumble':''}" style="--r:${(Math.random()*500-250)|0}deg;--d:${i*45}ms">${dieSVG(f)}</span>`).join('') : '<div class="emptydice">5 dadi pronti</div>'}</div>
    <div class="msg ${T.last.startsWith('+') ? 'good' : T.last ? 'bad' : ''}">${esc(busy ? 'I dadi rotolano…' : T.last)}</div>
    <div class="actions">${T.left > 0
      ? `<button class="btn gold wide" data-act="tiroroll" ${busy?'disabled':''}>Lancia · ${T.left} ${T.left===1?'lancio rimasto':'lanci rimasti'}</button>`
      : `<button class="btn gold wide" data-act="tirodone">Ritira ${T.coins} monete</button>`}</div>
  </div></div>`;
  tumble = false;
}
function tiroRoll(){
  const T = S.tiro; if(busy || T.left <= 0) return;
  T.dice = Array.from({length:5}, rnd6); T.left--; tiroNew = [];
  busy = true; tumble = true; render(); sndRoll(5);
  setTimeout(() => {
    if(S.tiro !== T) return;
    busy = false;
    TIRO_GOALS.forEach((g,i) => { if(!T.got.includes(i) && g.f(T.dice)){ T.got.push(i); tiroNew.push(i); T.coins += g.c; } });
    const won = tiroNew.reduce((a,i) => a + TIRO_GOALS[i].c, 0);
    T.last = won ? `+${won} 💰: ${tiroNew.map(i => TIRO_GOALS[i].t).join(', ')}` : !scores(T.dice) ? 'Cacchea! Niente monete' : 'Nessuna combinazione nuova';
    if(won) sndTone([784,988,1175]); else if(!scores(T.dice)) sndFart(0);
    save(); render();
  }, 800);
}
function tiroDone(){
  const T = S.tiro, st = story(T.pid);
  st.coins += T.coins; st.step = Math.max(st.step, T.step + 1);
  S.tiro = null; save(); render();
  showReward('Tiro a segno', `Hai fatto ${T.got.length} combinazioni su ${TIRO_GOALS.length}.`, T.coins);
}

// ---------- Regole ----------
function showRules(){
  const row = (f, label, pts) => `<tr><td>${dieSVG(f)} ${label}</td><td>${pts}</td></tr>`;
  openOv(`<div class="box rules" role="dialog" aria-modal="true">
    <h2>Regole di Cacchea</h2>
    <p>Si gioca con 5 dadi da poker. Al tuo turno tiri i 5 dadi, blocchi quelli che fanno punti (almeno uno) e rilanci gli altri. Puoi bloccare anche solo una parte dei dadi buoni: se escono due Q puoi tenerne una sola.</p>
    <table>
      ${row(5,'Asso singolo',100)}${row(3,'Q singola',50)}
      ${row(5,'Tris di Assi',700)}${row(4,'Tris di K',600)}${row(3,'Tris di Q',500)}${row(2,'Tris di J',400)}${row(1,'Tris di 10',300)}${row(0,'Tris di 9',200)}
    </table>
    <ul>
      <li>Il tris vale solo se i tre dadi escono nello stesso lancio. K, J, 10 e 9 da soli non si bloccano.</li>
      <li>Poker e cinque uguali contano come tris più gli Assi o le Q in più: 4 Assi valgono 800. Con 5 K blocchi il tris (600) e rilanci gli altri due. Con 4 Q blocchi 550 e tiri un dado, oppure tieni una Q sola (50) e tiri 4 dadi.</li>
      <li>Se nei dadi appena lanciati non c'è un Asso, una Q o un tris è <b>CACCHEA</b>: perdi tutti i punti di quel turno.</li>
      <li>Se riesci a bloccare tutti e 5 i dadi, li rilanci tutti e tieni i punti.</li>
      <li>Puoi fermarti quando vuoi e segnare i punti del turno.</li>
      <li>Per <b>aprire</b> (la prima volta in ogni partita) devi segnare almeno ${OPEN} punti in un solo turno.</li>
      <li>Oltre ${fmt(OUT)} punti (o il punteggio scelto prima della partita) puoi <b>chiamarti fuori</b> prima di tirare: gli altri fanno un ultimo turno a testa e poi vince chi ha più punti.</li>
    </ul>
    <h3>Modalità storia</h3>
    <ul>
      <li>Cinque tavoli con avversari sempre più bravi. Scegli tu quanti avversari, da 1 a 5: per passare il livello devi arrivare primo.</li>
      <li>Tra un livello e l'altro c'è un minibonus che dà monete. Con le monete compri gli aiuti: 🧻 rotolo salvacacca, ✋ ritocco, 🍀 quadrifoglio.</li>
    </ul>
    <div class="row"><button class="btn gold" data-act="close">Ho capito</button></div>
  </div>`);
}

// ---------- Eventi ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act, G = S.G, T = G?.turn;
  switch(act){
    case 'tab': S.tab = b.dataset.t; save(); render(); break;
    case 'pick': { const i = S.pick.indexOf(b.dataset.id); i >= 0 ? S.pick.splice(i,1) : S.pick.push(b.dataset.id); save(); render(); break; }
    case 'delp': e.stopPropagation(); S.roster = S.roster.filter(p => p.id !== b.dataset.id); S.pick = S.pick.filter(id => id !== b.dataset.id); if(S.hero === b.dataset.id) S.hero = null; save(); render(); break;
    case 'start': audio(); startGame(); break;
    case 'hero': S.hero = b.dataset.id; save(); render(); break;
    case 'nopp': story(S.hero).nOpp = +b.dataset.n; save(); render(); break;
    case 'target': S.target = +b.dataset.n; save(); render(); break;
    case 'speed': S.aiFast = b.dataset.f === '1'; save(); render(); break;
    case 'buy': { const st = story(S.hero), pw = POWERS[b.dataset.k]; if(st.coins >= pw.cost){ st.coins -= pw.cost; st.pw[b.dataset.k]++; save(); render(); toast(pw.icon + ' ' + pw.label + ' comprato'); sndTone([660,880]); } break; }
    case 'node': playNode(); break;
    case 'restory': story(S.hero).step = 0; save(); render(); break;
    case 'die': {
      if(busy || cp().ai) return;
      const i = +b.dataset.i;
      if(G.fixMode){ const st = heroStory(); T.roll[i] = 5; st.pw.fix--; G.fixMode = false; T.sel = []; log('usa il ritocco', '✋', 'good'); toast('Ritocco: ora è un Asso'); save(); render(); break; }
      const k = T.sel.indexOf(i); k >= 0 ? T.sel.splice(k,1) : T.sel.push(i); vib(10); save(); render(); break;
    }
    case 'best': T.sel = bestSel(T.roll); save(); render(); break;
    case 'clearsel': T.sel = []; save(); render(); break;
    case 'roll': audio(); roll(); break;
    case 'bank': bank(); break;
    case 'fix': G.fixMode = !G.fixMode; render(); break;
    case 'clover': { const st = heroStory(); st.pw.clover--; cp().opened = true; log('usa il quadrifoglio e apre', '🍀', 'good'); toast('Quadrifoglio: hai aperto!'); save(); render(); break; }
    case 'saveroll': savePoop('roll'); break;
    case 'savefix': savePoop('fix'); break;
    case 'callout': ask('Ti chiami fuori?', `${esc(cp().name)} non tira più. Gli altri giocatori fanno un ultimo turno a testa, poi la partita finisce.`, 'Mi chiamo fuori', callOut); break;
    case 'tiroroll': audio(); tiroRoll(); break;
    case 'tirodone': tiroDone(); break;
    case 'rules': showRules(); break;
    case 'sound': S.sound = !S.sound; save(); render(); if(S.sound) sndTone([660]); break;
    case 'quit': {
      const inStory = S.tiro || (G && (G.story || G.mini));
      ask(inStory ? 'Tornare alla storia?' : 'Uscire dalla partita?', inStory ? 'Questo livello non verrà contato: potrai rigiocarlo.' : 'La partita in corso verrà persa.', 'Esci', () => {
        clearTimeout(aiTimer); poopToken++; busy = false;
        if(inStory) S.tab = 'story';
        S.G = null; S.tiro = null; save(); render();
      }, true);
      break;
    }
    case 'close': closeOv(); break;
    case 'askok': { const f = askFn; askFn = null; closeOv(); f && f(); break; }
    case 'again': S.pick = G.players.map(q => q.id); startGame(); break;
    case 'newsetup': S.G = null; save(); render(); break;
    case 'tostory': S.G = null; S.tab = 'story'; save(); render(); break;
    case 'retry': startLevel(G.story.pid, G.story.step); break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$ov.hidden && !$ov.classList.contains('poopov')) closeOv(); });

// avvio: si riprende da dove si era rimasti
render();
if(S.G && !S.G.over && S.G.turn?.roll && !scores(S.G.turn.roll)) cacchea();
else aiGo();
</script>
